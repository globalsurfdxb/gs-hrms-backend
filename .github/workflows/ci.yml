name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hrms" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms?schema=public
      AUTH_DEV_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --exit-code 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Generate throwaway test keys
        run: |
          echo "SESSION_COOKIE_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "FIELD_BLIND_INDEX_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:arch
      - run: npm run typecheck
      - run: npm test

      - name: Migrate and seed test database
        run: npx prisma migrate deploy && npx prisma db seed
      - run: npm run test:e2e

      - name: OpenAPI contract is up to date
        run: |
          npm run openapi:export
          git diff --exit-code -- docs/api/openapi.json || (echo "::error::Run 'npm run openapi:export' and commit docs/api/openapi.json" && exit 1)
