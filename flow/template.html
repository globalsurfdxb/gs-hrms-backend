<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{{TITLE}}</title>
<style>
  @page { size: A4; margin: 14mm 13mm 16mm 13mm; }
  :root {
    --ink: #1d2433; --muted: #5b6475; --line: #d9dee8; --soft: #f4f6fa; --brand: #1f4fa3;
    --emp: #2f6fd6; --lead: #148f77; --hr: #7a4bd0; --admin: #c6851b; --sys: #6b7690; --cand: #1f9d63; --gap: #b3412e;
  }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: 'Noto Sans', 'Liberation Sans', Arial, sans-serif; color: var(--ink); font-size: 10.5pt; line-height: 1.45; margin: 0; }
  h1 { font-size: 20pt; margin: 0 0 2mm; color: var(--brand); }
  h2 { break-after: avoid; font-size: 13pt; margin: 6mm 0 2mm; color: var(--brand); border-bottom: 1.5px solid var(--line); padding-bottom: 1mm; }
  h3 { font-size: 11pt; margin: 4mm 0 1.5mm; }
  p { margin: 1.5mm 0; }
  .module { page-break-before: always; }
  .module:first-of-type { page-break-before: auto; }
  .kicker { font-size: 9pt; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .lead { font-size: 11.5pt; color: var(--muted); margin-bottom: 3mm; }
  .meta { display: grid; grid-template-columns: 30mm 1fr; gap: 1.2mm 4mm; background: var(--soft); border: 1px solid var(--line); border-radius: 2mm; padding: 3mm 4mm; margin: 3mm 0 4mm; font-size: 9.5pt; }
  .meta b { color: var(--muted); font-weight: 700; }
  .chip { display: inline-block; white-space: nowrap; border-radius: 10px; padding: 0 2.2mm; margin: 0 1mm .6mm 0; font-size: 8.5pt; font-weight: 700; color: #fff; }
  .c-emp { background: var(--emp); } .c-lead { background: var(--lead); } .c-hr { background: var(--hr); }
  .c-admin { background: var(--admin); } .c-sys { background: var(--sys); } .c-cand { background: var(--cand); }
  code { font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 8.5pt; background: var(--soft); padding: 0 1mm; border-radius: 1mm; }
  figure { margin: 3mm 0 4mm; border: 1px solid var(--line); border-radius: 2mm; padding: 3mm; page-break-inside: avoid; text-align: center; }
  figure svg { max-width: 100% !important; height: auto; max-height: 172mm; }
  figcaption { font-size: 9pt; color: var(--muted); margin-top: 2mm; text-align: left; }
  ol.steps { padding-left: 6mm; margin: 2mm 0; }
  ol.steps li { margin: 1.2mm 0; }
  ul { padding-left: 5mm; margin: 1.5mm 0; }
  li { margin: .8mm 0; }
  table { border-collapse: collapse; width: 100%; margin: 2mm 0 3mm; font-size: 9.2pt; page-break-inside: avoid; }
  th, td { border: 1px solid var(--line); padding: 1.2mm 2mm; text-align: left; vertical-align: top; }
  th { background: var(--soft); }
  .callout { border-left: 3px solid var(--brand); background: var(--soft); padding: 2.5mm 4mm; margin: 3mm 0; border-radius: 0 2mm 2mm 0; page-break-inside: avoid; }
  .callout.gap { border-left-color: var(--gap); background: #fbf0ee; }
  .callout h3 { margin-top: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
  .cover { height: 250mm; display: flex; flex-direction: column; justify-content: center; }
  .cover h1 { font-size: 30pt; }
  .toc { columns: 2; font-size: 10.5pt; }
  .toc li { break-inside: avoid; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3mm; margin: 3mm 0; }
  .card { border: 1px solid var(--line); border-radius: 2mm; padding: 2.5mm 3.5mm; page-break-inside: avoid; }
  .card h3 { margin: 0 0 1mm; font-size: 10.5pt; color: var(--brand); }
  .card p { margin: 0; font-size: 9.2pt; color: var(--muted); }
  .card.soon { border-style: dashed; }
  .legend { font-size: 9pt; margin: 1mm 0 3mm; }
  .legend span { display: inline-block; border: 1px solid; border-radius: 1.5mm; padding: 0 2mm; margin: 0 1.5mm 1mm 0; }
  .l-emp { background: #e3edfc; border-color: #2f6fd6 !important; } .l-lead { background: #dcf2ec; border-color: #148f77 !important; }
  .l-hr { background: #ece4fa; border-color: #7a4bd0 !important; } .l-admin { background: #fbeedb; border-color: #c6851b !important; }
  .l-sys { background: #eef0f4; border-color: #6b7690 !important; } .l-cand { background: #dff3e8; border-color: #1f9d63 !important; }
  .l-bad { background: #fbe7e3; border-color: #b3412e !important; }
  .short { background: #f7f9fc; border: 1px solid var(--line); border-radius: 2mm; padding: 2mm 4mm 2mm 9mm; margin: 2mm 0 4mm; }
  .short li { margin: 1mm 0; }
  .err { color: #b3412e; white-space: pre-wrap; }
</style>
</head>
<body>
{{BODY}}
<script src="mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'strict',
    theme: 'base',
    themeVariables: {
      fontFamily: 'Noto Sans, Liberation Sans, Arial, sans-serif', fontSize: '15px',
      primaryColor: '#eef3fc', primaryBorderColor: '#7f9fd6', primaryTextColor: '#1d2433',
      lineColor: '#7a8396', secondaryColor: '#f4f6fa', tertiaryColor: '#ffffff',
      clusterBkg: '#f7f9fc', clusterBorder: '#c9d2e3'
    },
    flowchart: { wrappingWidth: 300, htmlLabels: true, curve: 'basis', useMaxWidth: true, padding: 10, nodeSpacing: 28, rankSpacing: 34 },
    state: { useMaxWidth: true },
    sequence: { useMaxWidth: true, mirrorActors: false }
  });
  // Shared colours: who does the step. Usage in a flowchart:  A["Employee applies"]:::emp
  var ROLE_STYLES = [
    'classDef emp fill:#e3edfc,stroke:#2f6fd6,color:#1d2433',
    'classDef lead fill:#dcf2ec,stroke:#148f77,color:#1d2433',
    'classDef hr fill:#ece4fa,stroke:#7a4bd0,color:#1d2433',
    'classDef admin fill:#fbeedb,stroke:#c6851b,color:#1d2433',
    'classDef sys fill:#eef0f4,stroke:#6b7690,color:#1d2433',
    'classDef cand fill:#dff3e8,stroke:#1f9d63,color:#1d2433',
    'classDef bad fill:#fbe7e3,stroke:#b3412e,color:#1d2433',
    'classDef good fill:#dff3e8,stroke:#1f9d63,color:#1d2433,font-weight:bold'
  ].join('\n');
  document.querySelectorAll('.mermaid').forEach(function (el) {
    if (/^\s*flowchart/.test(el.textContent)) el.innerHTML = el.innerHTML + '\n' + ROLE_STYLES; // innerHTML keeps <br/> line breaks
  });
  mermaid.run({ querySelector: '.mermaid' })
    .then(function () { window.flowReady = true; })
    .catch(function (e) {
      document.body.insertAdjacentHTML('afterbegin', '<pre class="err">Diagram error: ' + String(e && e.message || e) + '</pre>');
      window.flowReady = true;
      setTimeout(function () { throw e; });
    });
</script>
</body>
</html>
